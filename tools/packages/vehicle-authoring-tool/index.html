<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vehicle authoring</title>
    <style>
      body { max-width: 72rem; margin: 2rem auto; padding: 0 1rem; color: #e4e9ee; background: #20252b; font-family: system-ui, sans-serif; }
      header, .toolbar { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
      h1 { font-size: 1.4rem; }
      h2 { font-size: 1rem; margin-top: 2rem; }
      button, select { font: inherit; }
      nav button[aria-pressed=true] { font-weight: bold; }
      .verdict-fails { color: #ff8f8f; }
      .verdict-judged { color: #e6c36a; }
      .vehicles-proposal { white-space: pre-wrap; }
      #issues:empty::before { content: 'None'; }
      #issues { white-space: pre-wrap; }
      table { border-collapse: collapse; width: 100%; }
      th, td { text-align: left; padding: 0.15rem 0.4rem; }
      td input:not([type=checkbox]) { width: 100%; box-sizing: border-box; font: inherit; }
      dialog form { display: grid; gap: 0.5rem; }
    </style>
  </head>
  <body>
    <header>
      <h1>Vehicle authoring</h1>
      <nav>
        <button id="show-blueprints" type="button" aria-pressed="true">Blueprints</button>
        <button id="show-vehicles" type="button" aria-pressed="false">Vehicles</button>
      </nav>
    </header>
    <main id="blueprints-view">
      <div class="toolbar">
        <label>Blueprint <select id="blueprint"></select></label>
        <label>Open saved blueprint <input id="open" type="file" accept=".json,application/json" /></label>
        <button id="save" type="button">Save edits</button>
        <button id="download" type="button">Download export</button>
      </div>
      <p id="message" role="status"></p>
      <section>
        <h2>Fittings</h2>
        <table>
          <thead>
            <tr><th>Id</th><th>Part</th><th>Position x, y, z</th><th>Mirror</th><th>Rests on</th><th>Cargo cells</th><th>Service</th><th></th></tr>
          </thead>
          <tbody id="fittings"></tbody>
        </table>
        <form id="add" class="toolbar">
          <label>Id <input name="id" required /></label>
          <label>Part <input name="part" list="parts" required /></label>
          <button type="submit">Add fitting</button>
        </form>
        <datalist id="parts"></datalist>
      </section>
      <dialog id="pair"></dialog>
      <section>
        <h2>Schema issues</h2>
        <pre id="issues"></pre>
      </section>
    </main>
    <main id="vehicles-view" hidden>
      <p class="vehicles-status" role="status"></p>
      <table>
        <thead>
          <tr><th>Vehicle</th><th>Site</th><th>Part</th><th>Swing</th><th>Detail</th><th></th></tr>
        </thead>
        <tbody class="vehicles-sites"></tbody>
      </table>
      <h2>Proposal</h2>
      <pre class="vehicles-proposal"></pre>
    </main>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
