name: lint

# Biome over tools/ and site/: formatting, lint and import order (see biome.jsonc); then knip over tools/, for
# dead code.

on:
  push:
    branches: [main]
    paths:
      - 'biome.jsonc'
      - 'tools/**'
      - 'site/**'
      - '.node-version'
      - '.github/actions/node/**'
      - '.github/actions/tools/**'
      - '.github/workflows/lint.yml'
      - '!**/*.md'
  pull_request:
    paths:
      - 'biome.jsonc'
      - 'tools/**'
      - 'site/**'
      - '.node-version'
      - '.github/actions/node/**'
      - '.github/actions/tools/**'
      - '.github/workflows/lint.yml'
      - '!**/*.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  biome:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools
    steps:
      - uses: actions/checkout@v4
      # The module-graph rules resolve JSON imports, so the lint needs the Jsonnet twins.
      - uses: ./.github/actions/tools
      # The npm script runs the lockfile's @biomejs/biome; `npx biome` could fall back to the unrelated `biome` package.
      - run: npm run lint -- --reporter=github
      - run: npm run knip
