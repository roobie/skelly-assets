name: surfaces

on:
  push:
    branches: [main]
    paths:
      - 'tools/packages/surfaces/**'
      - 'models/surfaces.libsonnet'
      - 'models/finishes.jsonnet'
      - 'tools/packages/thing-core/**'
      - 'tools/package.json'
      - 'tools/package-lock.json'
      - 'tools/tsconfig.base.json'
      - 'tools/sources.mjs'
      - 'tools/reviewSite.mjs'
      - 'tools/jsonnet/**'
      - '.node-version'
      - '.github/actions/node/**'
      - '.github/workflows/surfaces.yml'
      - '!**/*.md'
  pull_request:
    paths:
      - 'tools/packages/surfaces/**'
      - 'models/surfaces.libsonnet'
      - 'models/finishes.jsonnet'
      - 'tools/packages/thing-core/**'
      - 'tools/package.json'
      - 'tools/package-lock.json'
      - 'tools/tsconfig.base.json'
      - 'tools/sources.mjs'
      - 'tools/reviewSite.mjs'
      - 'tools/jsonnet/**'
      - '.node-version'
      - '.github/actions/node/**'
      - '.github/workflows/surfaces.yml'
      - '!**/*.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools/packages/surfaces
    steps:
      - uses: actions/checkout@v7
      - name: Cache go-jsonnet
        uses: actions/cache@v4
        with:
          path: tools/jsonnet/bin
          key: jsonnet-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/jsonnet/runtime.json') }}
      - uses: ./.github/actions/node
        with:
          npm-cache: true
      - run: npm ci --prefix ../..
      - run: npm run typecheck
      - run: npm test -- --maxWorkers=2
      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('tools/package-lock.json') }}
      - name: Install Playwright Chromium
        timeout-minutes: 3
        run: npx playwright install chromium
      # The shaders compile and draw on SwiftShader, the rasteriser a runner without a GPU has.
      - name: Browser tests (managed Chromium)
        timeout-minutes: 3
        run: npm run test:browser
