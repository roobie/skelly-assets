name: mobgen

on:
  push:
    branches: [main]
    paths: ['tools/packages/mobgen/**', 'tools/package-lock.json', 'tools/testPool.ts', '.github/workflows/mobgen.yml', '!**/*.md']
  pull_request:
    paths: ['tools/packages/mobgen/**', 'tools/package-lock.json', 'tools/testPool.ts', '.github/workflows/mobgen.yml', '!**/*.md']

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/packages/mobgen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - run: npm ci --prefix ../..
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
