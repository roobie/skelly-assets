name: slow-tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gungen:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/packages/gun-authoring-tool
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - run: npm ci --prefix ../.. --no-audit --no-fund --prefer-offline
      - run: node ../../sources.mjs
      - run: npm run test:sweeps

  thing-authoring-tool:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/packages/thing-authoring-tool
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - run: npm ci --prefix ../.. --no-audit --no-fund --prefer-offline
      - run: node ../../sources.mjs
      - run: npm run test:sweeps
