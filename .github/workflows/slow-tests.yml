name: slow-tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gungen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: tools/packages/gun-authoring-tool
    steps:
      - uses: actions/checkout@v4
      - name: Cache go-jsonnet
        uses: actions/cache@v4
        with:
          path: tools/jsonnet/bin
          key: jsonnet-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/jsonnet/runtime.json') }}
      - uses: ./.github/actions/node
        with:
          npm-cache: true
      - run: npm ci --prefix ../.. --no-audit --no-fund --prefer-offline
        timeout-minutes: 3
      - run: node ../../sources.mjs
      - run: npm run test:sweeps

  thing-authoring-tool:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: tools/packages/thing-authoring-tool
    steps:
      - uses: actions/checkout@v4
      - name: Cache go-jsonnet
        uses: actions/cache@v4
        with:
          path: tools/jsonnet/bin
          key: jsonnet-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/jsonnet/runtime.json') }}
      - uses: ./.github/actions/node
        with:
          npm-cache: true
      - run: npm ci --prefix ../.. --no-audit --no-fund --prefer-offline
        timeout-minutes: 3
      - run: node ../../sources.mjs
      - run: npm run test:sweeps

  mobgen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: tools/packages/mobgen
    steps:
      - uses: actions/checkout@v4
      - name: Cache go-jsonnet
        uses: actions/cache@v4
        with:
          path: tools/jsonnet/bin
          key: jsonnet-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/jsonnet/runtime.json') }}
      - uses: ./.github/actions/node
        with:
          npm-cache: true
      - run: npm ci --prefix ../.. --no-audit --no-fund --prefer-offline
        timeout-minutes: 3
      - run: node ../../sources.mjs
      - run: npm run test:sweeps

  tools:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/tools
      - name: Cache Playwright Chromium
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('tools/package-lock.json') }}
      - name: Install Playwright Chromium
        timeout-minutes: 3
        working-directory: tools
        run: npx playwright install chromium
      - run: node --test tools/test/*.test.mjs
        env:
          ASSETS_SWEEPS: '1'
