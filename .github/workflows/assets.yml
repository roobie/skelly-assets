name: assets

# Builds the complete tree from source twice, holds the builds to each other and to the manifest, then publishes the
# showcase from the build and a release of one archive per pack: a version's on a v* tag, with the model history that
# tag extends, the rolling edge pre-release on a push to main.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/tools
      - run: node --test tools/test/*.test.mjs

  # Two independent builds, so the check can show the build is deterministic rather than assume it. Unchanged models
  # come from the export cache. In a PR each copy keeps its own cache lineage, seeded from main's, so every model the PR
  # changes is generated by both copies independently, however the jobs are timed or re-run. Outside a PR the second
  # copy starts empty: a model the cache would have served stale fails the check before anything is published, and
  # main's cache is that clean copy's. A tag builds both copies clean.
  #
  # A clean copy generates every model, which one runner takes minutes over, so each copy's generation is split over
  # shards. A shard uploads only the cache entries it generated, and its copy's build job then reads them all as cache
  # hits. A PR's copies are seeded and seldom generate much, and every job takes a runner from the account's limited
  # pool, so a PR runs fewer shards. SHARDS is the length of the shard list.
  generate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        copy: [1, 2]
        shard: ${{ fromJSON(github.event_name == 'pull_request' && '[1, 2]' || '[1, 2, 3, 4, 5, 6]') }}
    env:
      SHARDS: ${{ github.event_name == 'pull_request' && 2 || 6 }}
      CLEAN: ${{ github.ref_type == 'tag' || (github.event_name != 'pull_request' && matrix.copy == 2) }}
      LINEAGE: ${{ github.event_name == 'pull_request' && format('pr-copy{0}', matrix.copy) || 'main' }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/tools
      - if: env.CLEAN == 'false'
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/export-cache
          key: exports-${{ runner.os }}-${{ env.LINEAGE }}-${{ github.sha }}
          restore-keys: |
            exports-${{ runner.os }}-${{ env.LINEAGE }}-
            exports-${{ runner.os }}-main-
      - name: Generate the shard
        shell: bash
        run: |
          cache="$RUNNER_TEMP/export-cache"
          mkdir -p "$cache" "$RUNNER_TEMP/generated"
          entries() { (cd "$cache" && find . -type f | sort); }
          entries > "$RUNNER_TEMP/seeded"
          node tools/build.mjs --shard "${{ matrix.shard }}/$SHARDS" --cache "$cache"
          node tools/mobs.mjs --shard "${{ matrix.shard }}/$SHARDS" --cache "$cache"
          entries | comm -13 "$RUNNER_TEMP/seeded" - | tar -C "$cache" -cf - -T - | tar -C "$RUNNER_TEMP/generated" -xf -
      - uses: actions/upload-artifact@v7
        with:
          name: exports-${{ matrix.copy }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/generated
          if-no-files-found: ignore
          retention-days: 1

  # A cache is saved only when its copy's entries changed, so a PR that changes no model stores nothing.
  build:
    needs: generate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        copy: [1, 2]
    env:
      CLEAN: ${{ github.ref_type == 'tag' || (github.event_name != 'pull_request' && matrix.copy == 2) }}
      LINEAGE: ${{ github.event_name == 'pull_request' && format('pr-copy{0}', matrix.copy) || 'main' }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/tools
      - if: env.CLEAN == 'false'
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/export-cache
          key: exports-${{ runner.os }}-${{ env.LINEAGE }}-${{ github.sha }}
          restore-keys: |
            exports-${{ runner.os }}-${{ env.LINEAGE }}-
            exports-${{ runner.os }}-main-
      - name: List the seeded entries
        run: |
          mkdir -p "$RUNNER_TEMP/export-cache"
          (cd "$RUNNER_TEMP/export-cache" && find . -type f | sort) > "$RUNNER_TEMP/seeded"
      - uses: actions/download-artifact@v8
        with:
          pattern: exports-${{ matrix.copy }}-*
          path: ${{ runner.temp }}/export-cache
          merge-multiple: true
      # The shards generated every cacheable row, so an entry this build adds is a row they missed or keyed under other
      # code, such as another Node version; it fails rather than leave that row generated by one runner alone. The build
      # prunes the entries no current model uses, so the cache changes when the shards added entries or the build pruned.
      - name: Build
        run: |
          entries() { (cd "$RUNNER_TEMP/export-cache" && find . -type f | sort); }
          entries > "$RUNNER_TEMP/merged"
          node tools/build-all.mjs --out "$RUNNER_TEMP/built" --cache "$RUNNER_TEMP/export-cache"
          added=$(entries | comm -13 "$RUNNER_TEMP/merged" - | wc -l)
          if [ "$added" != 0 ]; then
            echo "::error::the build generated $added cache entries that no shard did"
            exit 1
          fi
          if ! entries | cmp -s - "$RUNNER_TEMP/seeded"; then echo CHANGED=true >> "$GITHUB_ENV"; fi
      - if: env.CHANGED == 'true' && (github.event_name == 'pull_request' || (github.ref == 'refs/heads/main' && env.CLEAN == 'true'))
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/export-cache
          key: exports-${{ runner.os }}-${{ env.LINEAGE }}-${{ github.sha }}
      - uses: actions/upload-artifact@v7
        with:
          name: built-${{ matrix.copy }}
          path: ${{ runner.temp }}/built
          if-no-files-found: error
          retention-days: 7

  check:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/node
      - uses: actions/download-artifact@v8
        with:
          pattern: built-*
          path: ${{ runner.temp }}/fresh
      - run: node tools/check-built.mjs --fresh "$RUNNER_TEMP/fresh/built-1" --fresh "$RUNNER_TEMP/fresh/built-2"

  # The viewers need no built tree, so they build while the models do.
  viewers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/tools
      - run: node site/build-viewers.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: viewers
          path: tools/packages/*/dist
          if-no-files-found: error
          retention-days: 1

  # The site is assembled while the tests and the check still run; only deploying it waits for them.
  pages:
    needs: [build, viewers]
    runs-on: ubuntu-latest
    steps:
      # The footer names the latest release tag a main build follows, which needs every tag and the history behind them.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/tools
      - uses: actions/download-artifact@v8
        with:
          name: built-1
          path: built
      - uses: actions/download-artifact@v8
        with:
          name: viewers
          path: tools/packages
      # The latest release's model versions; a release without them leaves the showcase without versions rather than
      # failing a deploy, so the history can be attached to a release after this lands.
      - name: Fetch the model history
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: node tools/model-history.mjs fetch --optional --out "$RUNNER_TEMP/model-history.json"
      - name: Build the site
        run: |
          history=()
          if [ -f "$RUNNER_TEMP/model-history.json" ]; then history=(--history "$RUNNER_TEMP/model-history.json"); fi
          node site/build.mjs --require-viewers --analytics "${history[@]}" _site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, check, pages]
    permissions:
      pages: write
      id-token: write
    # One deploy at a time, and a running deploy is never cancelled.
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # A v* tag publishes that version's release; a push to main replaces the edge pre-release with its build.
  release:
    if: github.ref_type == 'tag' || github.ref == 'refs/heads/main'
    needs: [test, check]
    permissions:
      contents: write
    # Publishing never interleaves with another for the same tag; a newer push waiting here replaces an older one.
    concurrency:
      group: release-${{ github.ref_type == 'tag' && github.ref_name || 'edge' }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/node
      - uses: actions/download-artifact@v8
        with:
          name: built-1
          path: ${{ runner.temp }}/built
      - run: node tools/pack-release.mjs "$RUNNER_TEMP/built" "$RUNNER_TEMP/release"
      # The previous release's history, merged with this build's hashes; see tools/model-history.mjs.
      - name: Write the model history
        if: github.ref_type == 'tag'
        run: node tools/model-history.mjs release --tag "$GITHUB_REF_NAME" --built "$RUNNER_TEMP/built" --out "$RUNNER_TEMP/release/model-history.json"
      # The body is the tag's CHANGELOG.md section, written at release prep; see changes/README.md, "A release".
      - name: Publish the version release
        if: github.ref_type == 'tag'
        run: |
          node tools/changelog.mjs notes "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP"/release/* --verify-tag --notes-file "$RUNNER_TEMP/notes.md"
      # The tag goes with the release so the new one is cut at this commit, not at a tag left behind.
      - name: Replace the edge pre-release
        if: github.ref == 'refs/heads/main'
        run: |
          if gh release view edge >/dev/null 2>&1; then gh release delete edge --yes; fi
          if gh api "repos/$GH_REPO/git/refs/tags/edge" >/dev/null 2>&1; then gh api -X DELETE "repos/$GH_REPO/git/refs/tags/edge"; fi
          notes="$RUNNER_TEMP/notes.md"
          echo "The latest build of main, at $GITHUB_SHA. It is replaced on every push to main; pin a v* release instead." > "$notes"
          pending=$(node tools/changelog.mjs unreleased)
          if [ -n "$pending" ]; then printf '\n## Unreleased\n\n%s\n' "$pending" >> "$notes"; fi
          gh release create edge "$RUNNER_TEMP"/release/* --prerelease --latest=false --target "$GITHUB_SHA" \
            --title "edge (main at ${GITHUB_SHA::12})" --notes-file "$notes"
