name: assets

# Builds the complete tree from source twice, holds the builds to each other and to the manifest, then publishes the
# showcase from the build and a release of one archive per pack: a version's on a v* tag, the rolling edge
# pre-release on a push to main.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Cache go-jsonnet
        uses: actions/cache@v6
        with:
          path: tools/jsonnet/bin
          key: jsonnet-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/jsonnet/runtime.json') }}
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - run: npm ci --prefix tools
      - run: node --test tools/test/*.test.mjs

  # Two independent builds, so the check can show the build is deterministic rather than assume it. Unchanged models
  # come from the export cache. In a PR each copy keeps its own cache lineage, seeded from main's, so every model the PR
  # changes is generated by both copies independently, however the jobs are timed or re-run. Outside a PR the second
  # copy starts empty: a model the cache would have served stale fails the check before anything is published, and
  # main's cache is that clean copy's. A tag builds both copies clean. A cache is saved only when its build added
  # entries, so a PR that changes no model stores nothing.
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        copy: [1, 2]
    env:
      CLEAN: ${{ github.ref_type == 'tag' || (github.event_name != 'pull_request' && matrix.copy == 2) }}
      LINEAGE: ${{ github.event_name == 'pull_request' && format('pr-copy{0}', matrix.copy) || 'main' }}
    steps:
      - uses: actions/checkout@v7
      - name: Cache go-jsonnet
        uses: actions/cache@v6
        with:
          path: tools/jsonnet/bin
          key: jsonnet-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/jsonnet/runtime.json') }}
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - run: npm ci --prefix tools
      - if: env.CLEAN == 'false'
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/export-cache
          key: exports-${{ runner.os }}-${{ env.LINEAGE }}-${{ github.sha }}
          restore-keys: |
            exports-${{ runner.os }}-${{ env.LINEAGE }}-
            exports-${{ runner.os }}-main-
      - name: Build
        run: |
          entries() { find "$RUNNER_TEMP/export-cache" -type f 2>/dev/null | wc -l; }
          before=$(entries)
          node tools/build-all.mjs --out "$RUNNER_TEMP/built" --cache "$RUNNER_TEMP/export-cache"
          if [ "$(entries)" != "$before" ]; then echo GREW=true >> "$GITHUB_ENV"; fi
      - if: env.GREW == 'true' && (github.event_name == 'pull_request' || (github.ref == 'refs/heads/main' && env.CLEAN == 'true'))
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/export-cache
          key: exports-${{ runner.os }}-${{ env.LINEAGE }}-${{ github.sha }}
      - uses: actions/upload-artifact@v7
        with:
          name: built-${{ matrix.copy }}
          path: ${{ runner.temp }}/built
          if-no-files-found: error
          retention-days: 7

  check:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - uses: actions/download-artifact@v8
        with:
          pattern: built-*
          path: ${{ runner.temp }}/fresh
      - run: node tools/check-built.mjs --fresh "$RUNNER_TEMP/fresh/built-1" --fresh "$RUNNER_TEMP/fresh/built-2"

  # The site is assembled while the tests and the check still run; only deploying it waits for them.
  pages:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Cache go-jsonnet
        uses: actions/cache@v6
        with:
          path: tools/jsonnet/bin
          key: jsonnet-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/jsonnet/runtime.json') }}
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - run: npm ci --prefix tools
      - run: node tools/sources.mjs
      - uses: actions/download-artifact@v8
        with:
          name: built-1
          path: built
      - name: Build mobgen viewer
        working-directory: tools/packages/mobgen
        run: PAGES_ANALYTICS=1 npx vite build
      - name: Build gun-authoring-tool viewer
        working-directory: tools/packages/gun-authoring-tool
        run: PAGES_ANALYTICS=1 npx vite build
      - name: Build thing-authoring-tool viewer
        working-directory: tools/packages/thing-authoring-tool
        run: npx vite build
      - name: Build vehicle-authoring-tool viewer
        working-directory: tools/packages/vehicle-authoring-tool
        run: npx vite build
      - name: Assemble the site
        run: |
          node site/build.mjs _site
          for P in mobgen gun-authoring-tool thing-authoring-tool vehicle-authoring-tool; do
            mkdir -p _site/$P
            cp -r tools/packages/$P/dist/. _site/$P/
          done
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, check, pages]
    permissions:
      pages: write
      id-token: write
    # One deploy at a time, and a running deploy is never cancelled.
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # A v* tag publishes that version's release; a push to main replaces the edge pre-release with its build.
  release:
    if: github.ref_type == 'tag' || github.ref == 'refs/heads/main'
    needs: [test, check]
    permissions:
      contents: write
    # Publishing never interleaves with another for the same tag; a newer push waiting here replaces an older one.
    concurrency:
      group: release-${{ github.ref_type == 'tag' && github.ref_name || 'edge' }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - uses: actions/download-artifact@v8
        with:
          name: built-1
          path: ${{ runner.temp }}/built
      - run: node tools/pack-release.mjs "$RUNNER_TEMP/built" "$RUNNER_TEMP/release"
      - name: Publish the version release
        if: github.ref_type == 'tag'
        run: gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP"/release/* --verify-tag
      # The tag goes with the release so the new one is cut at this commit, not at a tag left behind.
      - name: Replace the edge pre-release
        if: github.ref == 'refs/heads/main'
        run: |
          if gh release view edge >/dev/null 2>&1; then gh release delete edge --yes; fi
          if gh api "repos/$GH_REPO/git/refs/tags/edge" >/dev/null 2>&1; then gh api -X DELETE "repos/$GH_REPO/git/refs/tags/edge"; fi
          gh release create edge "$RUNNER_TEMP"/release/* --prerelease --latest=false --target "$GITHUB_SHA" \
            --title "edge (main at ${GITHUB_SHA::12})" \
            --notes "The latest build of main, at $GITHUB_SHA. It is replaced on every push to main; pin a v* release instead."
